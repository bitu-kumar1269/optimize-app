name: Docker CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: bitukumar
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Image
        run: docker build -t bitukumar/optimize-app:v1 .

      - name: Push Image
        run: docker push bitukumar/optimize-app:v1

      - name: Verify Image
        run: docker images

      - name: Check Running Containers
        run: docker ps